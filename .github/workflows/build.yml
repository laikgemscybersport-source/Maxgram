name: Build APK + Web ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Находит папку с проектом: она может лежать в корне репозитория
  # или внутри messenger/ — обе структуры поддерживаются.
  detect:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.find.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          if [ -f client/package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f messenger/client/package.json ]; then
            echo "dir=messenger" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Не найден client/package.json" && exit 1
          fi

  build-apk:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        working-directory: ${{ needs.detect.outputs.dir }}/client
        run: npm install

      - name: Build web assets
        working-directory: ${{ needs.detect.outputs.dir }}/client
        run: npm run build

      - name: Sync Capacitor (copies dist into the Android project)
        working-directory: ${{ needs.detect.outputs.dir }}/client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ needs.detect.outputs.dir }}/client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MAXgram-debug
          path: ${{ needs.detect.outputs.dir }}/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-web-zip:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build client
        working-directory: ${{ needs.detect.outputs.dir }}/client
        run: |
          npm install
          npm run build

      - name: Pack dist into ZIP
        run: |
          cd "${{ needs.detect.outputs.dir }}/client/dist"
          zip -r "$GITHUB_WORKSPACE/maxgram-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: MAXgram-web
          path: maxgram-web.zip
          retention-days: 30
